[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2md"
version = "0.6.0"
description = "Local OCR → structured Markdown for scanned books and long screenshots (no LLM, macOS Vision / RapidOCR)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "p2md contributors"}]
keywords = ["ocr", "markdown", "scanned-book", "vision", "rapidocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "rapidocr>=3.10; sys_platform != 'darwin'",
    "onnxruntime>=1.20; sys_platform != 'darwin'",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
build = ["build>=1.0", "twine>=5.0"]
rapidocr = ["rapidocr>=3.10", "onnxruntime>=1.20"]

[project.scripts]
p2md = "p2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p2md = ["ocr_batch.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
