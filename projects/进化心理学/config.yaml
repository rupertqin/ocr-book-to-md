# ocr-book-to-md 项目配置
# 优先级: 命令行参数 > .env > config.yaml > 默认值

# 书籍信息
book:
  name: "进化心理学"
  images_dir: "data/images"   # 项目内输入截图（相对项目目录解析）
  start_page: null
  end_page: null
  force_ocr: false

# document-factory PDF 流程（把 output/content/ 交给它生成 PDF）
pdf:
